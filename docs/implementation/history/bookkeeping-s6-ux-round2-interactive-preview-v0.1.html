<script>
const views=[['net','净值趋势'],['account','账户流水'],['filter','统计筛选'],['category','分类管理'],['tag','标签管理'],['entry','记一笔'],['accountpick','选择账户']];let page=new URLSearchParams(location.search).get('page')||'entry';if(!views.some(x=>x[0]===page))page='entry';let selectedAcc='银行', accBals={'银行':'¥251,132.61','储蓄':'¥5,000.00','微信':'¥−105,017.56','支付宝':'¥−105,570.20','信用':'¥−119,027.57','现金':'¥−115,904.50'};let type='支出',fPeriod='本月',fAccountScope='normal',fArchive=false,selAccounts=['银行','储蓄'],manageMode=false,selectedNode=null,dragging=null,showSheet=false;let cat=[{id:'c1',name:'餐饮',parent:null,count:0},{id:'c2',name:'早餐',parent:'c1',count:45},{id:'c3',name:'午餐',parent:'c1',count:58},{id:'c4',name:'外卖',parent:'c1',count:36},{id:'c5',name:'交通',parent:null,count:0},{id:'c6',name:'打车',parent:'c5',count:47},{id:'c7',name:'通勤',parent:'c5',count:29},{id:'c8',name:'购物',parent:null,count:42},{id:'c9',name:'医疗',parent:null,count:21}];let tags=[{id:'t1',name:'家庭',parent:null,count:27},{id:'t2',name:'孩子',parent:'t1',count:15},{id:'t3',name:'日用',parent:null,count:20},{id:'t4',name:'工作',parent:null,count:13},{id:'t5',name:'入账',parent:null,count:3}];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); const status=()=>`<div class="status"><span>9:41</span><span>●▥ ▰</span></div>`;const header=(name,back='stats',right='')=>`<div class="navbar"><button class="navbtn" onclick="go('${back}')">‹</button><span class="caption">${name}</span><div class="rightactions">${right||'<span style="width:38px"></span>'}</div></div>`;const card=(c,cls='')=>`<div class="card ${cls}">${c}</div>`;function go(p){page=p;showSheet=false;selectedNode=null;render()};function setP(p){fPeriod=p;render()};const tagtxt=(t)=>`<span class="tag">${t}</span>`;
function lineGraph(){let d=[-181873,-183447,-183953,-185586,-168995,-170366,-169710,-172843,-174303,-175220,-176839,-178013,-177860,-179502,-180762,-182535,-182201,-185210,-186127,-187602,-188450,-189100,-189387];let W=354,H=147,pad=8,ymin=Math.min(...d)-1800,ymax=Math.max(...d)+1800;let xy=d.map((v,i)=>({x:pad+i*(W-2*pad)/(d.length-1),y:12+(ymax-v)/(ymax-ymin)*118}));let path=xy.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');let area=path+` L ${W-pad},${H} L ${pad},${H} Z`;return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="示意每日末笔交易结算后净值折线图"><defs><linearGradient id="under" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3784cf" stop-opacity=".18"/><stop offset="1" stop-color="#3784cf" stop-opacity="0"/></linearGradient></defs>${[25,67,109].map(y=>`<path d="M 8,${y} H ${W-8}" stroke="#edf0f4" stroke-dasharray="4 4"/>`).join('')}<path d="${area}" fill="url(#under)"/><path d="${path}" stroke="#4c85c2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.8"/><circle cx="${xy.at(-1).x}" cy="${xy.at(-1).y}" r="4" fill="#4c85c2" stroke="white" stroke-width="2.2"/></svg>`}
function net(){return status()+header('净值趋势','stats',`<button class="action" onclick="go('filter')">筛选</button>`)+`<div class="scroll no-tab"><div class="seg">${['本月','本季','本年','近1月','近3月','近1年'].map(s=>`<button class="${s===fPeriod?'on':''}" onclick="setP('${s}')">${s}</button>`).join('')}<button onclick="go('filter')">更多 ⌄</button></div>${card(`<div class="small" style="margin-bottom:16px">2026年10月1日—10月27日</div><div class="three">${[['期初','¥−175,320.04'],['期末','¥−189,387.22'],['变化','¥−14,067.18']].map(([k,v])=>`<div class="metric"><span>${k}</span><strong class="green num">${v}</strong></div>`).join('')}</div><div class="chart-box">${lineGraph()}</div><div class="chart-axis"><span>10月1日</span><span>10月14日</span><span>10月27日</span></div><button class="softbutton" onclick="go('account')">查看期间交易　›</button>`,'padded')}<div class="heading">每日净值</div>${card(['10月27日','10月26日','10月25日'].map((d,i)=>`<div class="tapline"><span style="font-size:13px;font-weight:670">${d}</span><span class="green num" style="font-weight:720">${['¥−189,387.22','¥−189,100.00','¥−188,450.00'][i]}</span></div>`).join(''))}</div>`}
function tx(icon,name,desc,time,value){return `<div class="tx"><span class="iconcircle" style="background:#f0f4f8;color:#8091a1">${icon}</span><div class="grow"><div class="tx-title">${name}</div><div class="tx-desc">${desc}　·　${time}</div></div><span class="tx-amount green num">${value}</span></div>`}
function account(){return status()+header('银行','home',`<button class="action" onclick="alert('账户设置入口演示')">账户设置</button>`)+`<div class="scroll no-tab with-fab">${card(`<div class="acc-ident"><span class="iconcircle">▣</span><div><strong>银行</strong><small>普通账户</small></div></div><div class="heading" style="margin-top:19px">当前余额</div><div class="acc-amount red num">¥ 251,132.61</div>`,'account-hero')}<div class="date-switch"><button>‹</button><strong>2026年10月</strong><button>›</button></div>${card(`<div class="summary">${[['收入','¥34,000.00'],['支出','¥13,908.25'],['截至今日','¥251,132.61']].map(([k,v])=>`<div><span>${k}</span><b class="${k==='收入'?'red':k==='支出'?'green':'red'} num">${v}</b></div>`).join('')}</div>`,'padded')}<div class="heading">交易记录</div><div class="search" onclick="alert('按交易名称搜索，演示不接后端')">⌕　搜索交易名称</div><div class="daytitle"><span>10月27日　周二</span><small>3 笔</small></div>${card(tx('☕','午餐','餐饮 › 午餐 · 日用','12:37','¥−91.10')+tx('◷','早餐','餐饮 › 早餐 · 工作','07:29','¥−8.32')+tx('▧','购物','购物 · 孩子','06:34','¥−159.95'))}<div class="daytitle"><span>10月26日　周一</span><small>2 笔</small></div>${card(tx('◎','通勤','交通 › 通勤','08:02','¥−6.00')+tx('♧','餐饮','餐饮 › 外卖','19:18','¥−28.50'))}</div><button class="fab" onclick="go('entry')">＋</button>`}
function filterPage(){return status()+header('统计筛选','net',`<button class="action" onclick="go('net')">完成</button>`)+`<div class="scroll no-tab"><div class="heading">时间范围</div>${card(`<div class="padded" style="padding:15px"><div class="pill-row">${['本月','本季','本年','近1月','近3月','近1年'].map(t=>`<button class="chip" style="border:0;padding:9px 12px;border-radius:18px;background:${t===fPeriod?'#e9f1fc':'#f1f3f5'};color:${t===fPeriod?'#3478cf':'#75828e'};font-size:12px;margin-right:2px;margin-bottom:6px" onclick="setP('${t}')">${t}</button>`).join('')}</div><div class="divider" style="margin:12px 0"></div><div class="row"><span style="font-size:13px;color:var(--muted)">开始日期</span><b style="font-size:14px">2026-10-01　⌄</b></div><div class="divider" style="margin:13px 0"></div><div class="row"><span style="font-size:13px;color:var(--muted)">结束日期</span><b style="font-size:14px">2026-10-27　⌄</b></div></div>`)}<div class="heading">账户范围</div>${card(`<div class="tapline" onclick="fArchive=!fArchive;render()"><span><b>包含归档账户</b><br><span class="mini">默认不包含</span></span><button class="switch ${fArchive?'on':''}"><i></i></button></div><div class="tapline" onclick="fAccountScope=fAccountScope==='custom'?'normal':'custom';render()"><span><b>自选账户</b><br><span class="mini">${fAccountScope==='custom'?selAccounts.join('、'):'当前全部正常账户'}</span></span><span class="right">${fAccountScope==='custom'?'✓':'›'}</span></div>`)}${fAccountScope==='custom'?`<div class="heading">选择账户</div>${card(['银行','储蓄','微信','支付宝','信用','现金'].map(n=>`<div class="tapline" onclick="selAccounts=${JSON.stringify(selAccounts)};toggleAcc('${n}')"><span>${n}</span><div class="check ${selAccounts.includes(n)?'on':''}">${selAccounts.includes(n)?'✓':''}</div></div>`).join(''))}`:''}<button class="softbutton" onclick="go('net')">应用筛选</button></div>`}
function toggleAcc(n){if(selAccounts.includes(n))selAccounts=selAccounts.filter(x=>x!==n);else selAccounts.push(n);render()}
function getTree(){return page==='category'?cat:tags};function renderTree(){let arr=getTree();let rows=[];let add=(parent,depth)=>{arr.filter(x=>x.parent===parent).forEach(n=>{rows.push({n,depth});add(n.id,depth+1)})};add(null,0);return rows.map(({n,depth})=>`<div class="tree-node ${selectedNode===n.id?'dragging':''}" draggable="true" ondragstart="dragging='${n.id}';event.dataTransfer.setData('text/plain','${n.id}')" ondragover="event.preventDefault();this.classList.add('drop-target')" ondragleave="this.classList.remove('drop-target')" ondrop="event.preventDefault();this.classList.remove('drop-target');moveNode(dragging,'${n.id}')"><span class="${depth?'childbar':'indent'}" style="margin-left:${depth*20}px"></span><div class="node-name">${esc(n.name)}<div class="node-sub">${arr.some(x=>x.parent===n.id)?'有下级':page==='category'?`${n.count} 笔直接关联`:`已关联 ${n.count} 笔`}</div></div><button class="handlebtn" aria-label="调整${esc(n.name)}的上级" onclick="selectedNode='${n.id}';showSheet=true;render()">⠿</button></div>`).join('')}
function treePage(){let iscat=page==='category';return status()+header(iscat?'分类管理':'标签管理','mine',`<button class="action" onclick="alert('新增${iscat?'分类':'标签'}演示')">＋ 新增</button>`)+`<div class="scroll no-tab"><div class="seg">${iscat?`<button class="on">支出分类</button><button onclick="alert('切换为收入分类，演示样式相同')">收入分类</button>`:'<button class="on">全部标签</button>'}</div><div class="row" style="margin:8px 1px 15px"><span class="small">按住右侧手柄移动层级</span><button class="tiny-link" onclick="alert('本原型可点击手柄选择上级，也可使用电脑拖放；不修改真实数据')">操作说明 ⓘ</button></div><div class="tree">${renderTree()}</div><button class="tree-create" onclick="alert('新增${iscat?'分类':'标签'}演示')">＋ 新增${iscat?'分类':'标签'}</button></div>${showSheet?moveSheet():''}`}
function descendants(id,a){let out=[];const rec=(x)=>{for(let child of a.filter(y=>y.parent===x)){out.push(child.id);rec(child.id)}};rec(id);return out};function level(id,a){let k=0,n=a.find(x=>x.id===id);while(n&&n.parent){k++;n=a.find(x=>x.id===n.parent)}return k};function subtreeDepth(id,a){let kids=a.filter(x=>x.parent===id);return kids.length?1+Math.max(...kids.map(x=>subtreeDepth(x.id,a))):1};function eligible(node,target,a,isCat){if(target===node.id||descendants(node.id,a).includes(target))return false;let targetLev=target?level(target,a)+1:0;if(targetLev+subtreeDepth(node.id,a)>3)return false;if(target&&isCat){let tr=a.find(x=>x.id===target);if(tr.count>0)return false}return true};function moveSheet(){let a=getTree(),iscat=page==='category',node=a.find(x=>x.id===selectedNode);if(!node)return '';let opt=[{id:null,name:'作为一级'}].concat(a.filter(x=>x.id!==node.id).map(x=>({id:x.id,name:'放到「'+x.name+'」下'})));return `<div class="sheetback" onclick="showSheet=false;render()"></div><div class="sheet"><div class="handle"></div><div class="sheet-title">移动「${node.name}」</div><div class="selection-box"><span>当前上级</span><b>${node.parent?(a.find(x=>x.id===node.parent)?.name||''):'一级'}</b></div><div class="card">${opt.map(o=>{let ok=eligible(node,o.id,a,iscat);return `<button class="tapline" ${ok?'': 'disabled'} onclick="moveNode('${node.id}',${o.id?`'${o.id}'`:'null'})"><span><b>${o.name}</b></span><span class="right">${ok?'›':'×'}</span></button>`}).join('')}</div><div class="btnrow"><button class="btn" onclick="showSheet=false;render()">取消</button><button class="btn primary" onclick="showSheet=false;render()">完成</button></div></div>`}
function moveNode(from,to){if(!from)return;let a=getTree(),n=a.find(x=>x.id===from);if(!n||!eligible(n,to,a,page==='category')){alert('该落点不满足现有层级或分类直接关联规则');return}n.parent=to;showSheet=false;selectedNode=null;dragging=null;render()}
function entry(){return status()+header('记一笔','account',`<button class="action strong" onclick="alert('原型不接后端，也不会保存交易')">保存</button>`)+`<div class="scroll no-tab"><div class="card form-head"><div class="typegroup"><button class="${type==='支出'?'sel':''}" onclick="type='支出';render()">支出</button><button class="${type==='收入'?'sel':''}" onclick="type='收入';render()">收入</button></div><div class="form-amt"><strong>0.00</strong><small>CNY</small></div></div><div class="heading">交易信息</div>${card(`<button class="formfield" onclick="go('accountpick')"><span class="flabel">账户</span><span class="fvalue">${selectedAcc}　<span class="mini">${accBals[selectedAcc]}</span></span><span class="next">›</span></button><button class="formfield" onclick="alert('输入名称')"><span class="flabel">名称</span><span class="fvalue muted">填写交易名称</span><span class="next">›</span></button><button class="formfield" onclick="alert('分类选择（保持叶子规则）')"><span class="flabel">分类</span><span class="fvalue">餐饮 › 午餐</span><span class="next">›</span></button><button class="formfield" onclick="alert('标签选择（保持父子显式多选）')"><span class="flabel">标签</span><span class="fvalue">${tagtxt('日用')}${tagtxt('工作')}</span><span class="next">›</span></button>`)}<div class="heading">时间与备注</div>${card(`<button class="formfield" onclick="alert('选择业务时间')"><span class="flabel">时间</span><span class="fvalue">2026年10月27日　21:38</span><span class="next">›</span></button><button class="formfield" onclick="alert('输入备注')"><span class="flabel">备注</span><span class="fvalue muted">选填</span><span class="next">›</span></button>`)}<div class="notice-muted" style="margin-top:11px"> </div></div><div class="bottomnav"><button onclick="alert('原型演示：不会产生真实交易')">保存${type}</button></div>`}
function accountpick(){return entry()+`<div class="sheetback" onclick="go('entry')"></div><div class="sheet" style="max-height:67%;"><div class="handle"></div><div class="sheet-title">选择资金账户</div><div class="search" style="margin:0 0 12px">⌕　搜索账户</div><div class="card">${[['银行','普通账户','¥251,132.61','red'],['储蓄','普通账户','¥5,000.00','red'],['微信','普通账户','¥−105,017.56','green'],['支付宝','普通账户','¥−105,570.20','green'],['信用','信用账户','¥−119,027.57','green'],['现金','普通账户','¥−115,904.50','green']].map(([n,info,amount,col],i)=>`<button class="sheet-row" style="border:0;border-top:${i?'1px solid var(--line)':'0'};width:100%;text-align:left" onclick="pickAcc('${n}')"><span class="iconcircle">${i===4?'▤':'▣'}</span><div class="grow"><b>${n}</b><small>${info}</small></div><strong class="num ${col}" style="font-size:12px">${amount}</strong><span style="color:${n===selectedAcc?'var(--blue)':'#c9d0d9'};font-size:20px">${n===selectedAcc?'✓':'›'}</span></button>`).join('')}</div><button class="softbutton" onclick="go('entry')">取消</button></div>`}
function pickAcc(n){selectedAcc=n;go('entry')}
function stats(){return status()+header('统计','home')+`<div class="scroll no-tab"><div class="heading">账本分析</div><div class="card">${['净值趋势','收入分类对比','收入标签对比','支出分类对比','支出标签对比'].map((x,i)=>`<button class="tapline" onclick="go(i===0?'net':'net')"><span><b>${x}</b></span><span class="right">›</span></button>`).join('')}</div><div class="notice-muted">本原型主要展示第二轮需要审阅的净值趋势及交易、管理页面</div></div>`}
function home(){return status()+header('账本','stats')+`<div class="scroll no-tab"><div class="heading">资金摘要</div><div class="card padded"><div class="small">本月账本净值</div><div class="hero-big green num">¥−189,387.22</div><div class="two"><div><span class="mini">本月收入</span><div class="num">¥34,000.00</div></div><div><span class="mini">本月支出</span><div class="num">¥48,067.18</div></div></div></div><div class="heading">账户</div><div class="card"><button class="tapline" onclick="go('account')"><span>银行</span><b class="red num">¥251,132.61</b></button></div></div>`}
function mine(){return status()+header('我的','home')+`<div class="scroll no-tab"><div class="heading">账本管理</div><div class="card"><button class="tapline" onclick="go('category')"><span>分类管理</span><span class="right">›</span></button><button class="tapline" onclick="go('tag')"><span>标签管理</span><span class="right">›</span></button></div></div>`}
function render(){document.getElementById('screen').innerHTML=({net,account,filter:filterPage,category:treePage,tag:treePage,entry,accountpick,home,stats,mine}[page]||entry)();document.getElementById('tools').innerHTML=views.map(([id,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')+`<button onclick="go('entry')">回到录入</button>`;try{history.replaceState(null,'','?page='+page)}catch(e){};}
render();
</script></body></html>

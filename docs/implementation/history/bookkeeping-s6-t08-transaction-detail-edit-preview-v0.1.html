<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>记账软件｜交易详情与编辑 · UI 审阅 v0.1</title>
<style>
:root{--bg:#f4f6f9;--paper:#fff;--ink:#202a37;--muted:#818c99;--line:#edf0f3;--blue:#3478cf;--blue-soft:#e9f1fc;--red:#c74744;--green:#197e54;--shadow:0 5px 22px rgba(28,42,61,.045)}
*{box-sizing:border-box}body{margin:0;background:#e5e8ef;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px}button,input,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.stage{display:flex;gap:18px;justify-content:center;align-items:flex-start;padding:16px 12px;flex-wrap:wrap}.phone{width:390px;max-width:100%;height:812px;background:var(--bg);border-radius:30px;position:relative;overflow:hidden;box-shadow:0 15px 45px #344b6a2a}.status{height:31px;padding:9px 20px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700}.nav{height:57px;padding:0 17px;display:flex;align-items:center;justify-content:space-between;position:relative}.back{border:0;background:none;color:#506073;font-size:29px;width:40px;text-align:left}.navtitle{font-size:17px;font-weight:750;position:absolute;left:50%;transform:translateX(-50%)}.navright{border:0;background:none;color:#617a99;font-size:12px;font-weight:650;min-width:40px;text-align:right}.viewport{overflow-y:auto;height:calc(100% - 88px);padding:11px 16px 110px;scrollbar-width:thin}.headcard{background:#fff;border-radius:18px;padding:20px 20px 18px;box-shadow:var(--shadow);margin-bottom:12px}.smallcaps{font-size:12px;color:var(--muted);font-weight:650}.titlebig{font-size:22px;font-weight:800;margin-top:10px}.amount{font-size:35px;font-weight:780;letter-spacing:-.7px;margin-top:8px;font-variant-numeric:tabular-nums}.red{color:var(--red)}.green{color:var(--green)}.muted{color:var(--muted)}.capsule{display:inline-flex;background:#f1f4f8;color:#536478;border-radius:9px;padding:6px 9px;font-size:12px;font-weight:650}.card{background:var(--paper);border-radius:17px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}.sectionbar{font-size:12px;color:#748399;margin:18px 5px 8px;font-weight:700}.info{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:57px;padding:16px 17px}.info+.info{border-top:1px solid var(--line)}.label{color:var(--muted);font-size:13px;flex-shrink:0}.value{text-align:right;line-height:1.45;font-size:14px;font-weight:620}.tokens{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}.token{border-radius:10px;background:#eef3fa;color:#55708d;padding:6px 10px;font-size:12px;font-weight:650}.plainnote{padding:17px 18px;color:#a5aebb;font-size:13px}.actionfooter{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,#f4f6f9 90%,rgba(244,246,249,.1));padding:15px 16px 25px;display:flex;gap:10px;z-index:3}.btn{border:0;border-radius:12px;min-height:48px;font-weight:760;font-size:15px;background:#e8edf4;color:#52667e}.primary{background:var(--blue);color:#fff}.outline{background:#fff;border:1px solid #e3e9f0;color:#60738b}.actionfooter .btn{flex:1}.danger{color:var(--red)}.edit-title{font-size:13px;color:#8693a1;font-weight:650}.type-line{display:flex;align-items:center;gap:10px;margin-bottom:14px}.type-chip{background:#e8f0fb;color:#3478cf;padding:7px 12px;border-radius:10px;font-size:13px;font-weight:750}.biginput{width:100%;padding:5px 0;background:transparent;border:none;outline:none;font-size:36px;font-weight:760;letter-spacing:-1px;color:#222b39}.editcard{background:#fff;border-radius:17px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}.field{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:60px}.field+.field{border-top:1px solid var(--line)}.ficon{display:grid;place-items:center;width:31px;height:31px;border-radius:9px;background:#edf4fe;color:#5984ba;font-size:15px;flex:none}.fb{flex:1;min-width:0}.flabel{font-size:11px;color:var(--muted);margin-bottom:6px}.fval{font-size:14px;font-weight:670}.entryinput{width:100%;font-size:15px;border:0;outline:0;background:transparent;color:var(--ink)}.chev{color:#a2afbf;font-size:23px}.lock{font-size:12px;color:#abb7c5}.tap{width:100%;border:0;text-align:left;background:white}.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:5px}.pill{background:#eaf2fc;color:#437bad;border-radius:14px;padding:6px 10px;font-size:12px;font-weight:650}.pills .add{background:#f2f4f8;color:#687687;border:1px dashed #cbd4df}.noteinput{width:100%;resize:none;height:55px;background:transparent;border:0;outline:0;font-size:14px;padding-top:5px}.list-day{color:#8493a3;font-weight:700;font-size:12px;margin:15px 4px 9px}.tx-row{width:100%;text-align:left;display:flex;gap:12px;padding:17px 15px;align-items:center;border:0;background:white}.tx-row+.tx-row{border-top:1px solid var(--line)}.txicon{background:#e8f1fc;color:#4f79ac;border-radius:11px;width:36px;height:36px;display:grid;place-items:center}.txname{font-size:15px;font-weight:740}.txmeta{margin-top:5px;font-size:12px;color:var(--muted)}.txmoney{margin-left:auto;font-weight:740;color:var(--red);white-space:nowrap}.sheet-overlay{position:absolute;inset:0;background:#14202b67;z-index:10}.sheet{position:absolute;z-index:11;bottom:0;left:0;right:0;border-radius:22px 22px 0 0;background:#f6f8fb;padding:12px 15px 24px;max-height:70%;overflow:auto}.handle{width:38px;height:4px;border-radius:5px;background:#d6dde7;margin:0 auto 13px}.sheet-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.sheet-top strong{font-size:16px}.sheet-top button{background:transparent;border:0;color:var(--blue);font-size:13px;font-weight:750}.sheet-option{background:#fff;border:0;width:100%;padding:13px 14px;text-align:left;display:flex;align-items:center;justify-content:space-between;font-size:14px}.sheet-option+.sheet-option{border-top:1px solid var(--line)}.sheet-option:first-of-type{border-radius:12px 12px 0 0}.sheet-option:last-of-type{border-radius:0 0 12px 12px}.sheet-option .check{color:var(--blue);font-weight:800}.toast{position:absolute;z-index:20;bottom:92px;left:50%;transform:translateX(-50%);background:#243b55;color:white;border-radius:20px;font-size:12px;padding:9px 18px;white-space:nowrap;display:none}.outside-controls{width:390px;max-width:100%;margin:0 auto 22px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.outside-controls button{background:#fff;border:1px solid #d2d9e2;border-radius:10px;padding:10px 13px;font-size:12px;color:#4d5e73}.outside-controls button.active{background:#3478cf;color:#fff;border-color:#3478cf}.captionline{max-width:410px;font-size:12px;line-height:1.8;text-align:center;margin:10px auto;color:#58697d;padding:0 14px}
@media(max-width:560px){body{background:#e5e8ef}.stage{padding:0}.phone{border-radius:0;width:100vw;max-width:430px;height:calc(100dvh - 100px);min-height:620px;box-shadow:none}.outside-controls{padding-top:10px}}
</style></head><body>
<div class="stage"><div class="phone"><div class="status"><span>9:41</span><span>●●● ▰ 100%</span></div><div class="nav"><button id="back" class="back" aria-label="返回" onclick="back()">‹</button><div id="navtitle" class="navtitle"></div><button class="navright" onclick="go('list')">账本</button></div><div class="viewport" id="viewport"></div><div class="actionfooter" id="actions"></div><div id="overlay"></div><div class="toast" id="toast"></div></div></div>
<div class="outside-controls"><button onclick="go('list')" id="ctl-list">交易列表</button><button onclick="go('detail')" id="ctl-detail">只读详情</button><button onclick="go('edit')" id="ctl-edit">编辑表单</button></div>
<div class="captionline">交互原型 · 所有金额及信息均为示意，不连接真实后端。点击交易进入详情；点击编辑后可修改示意字段；取消返回详情。</div>
<script>
let page='detail',sheet='',saved={name:'午餐',amount:'83.60',account:'信用',cat:'餐饮 / 午餐',tags:['日用'],time:'2026-10-27 16:03',note:''},draft={...saved};
const val=v=>String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function go(p){page=p;sheet='';if(p==='edit')draft={...saved,tags:[...saved.tags]};render()}
function back(){if(sheet){sheet='';render();return} if(page==='edit'){go('detail')} else if(page==='detail'){go('list')} else{go('detail')}}
function formatMoney(s){const n=Number(s);return (Number.isFinite(n)?n:0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function detail(){return `<div class="headcard"><div class="type-line"><span class="type-chip">支出</span></div><div class="titlebig">${val(saved.name||'未命名交易')}</div><div class="amount red">¥${formatMoney(saved.amount)}</div></div><div class="sectionbar">交易信息</div><div class="card"><div class="info"><span class="label">资金账户</span><span class="value">${val(saved.account)} <span class="muted">(信用)</span></span></div><div class="info"><span class="label">分类</span><span class="value">${val(saved.cat)}</span></div><div class="info"><span class="label">标签</span><span class="tokens">${saved.tags.length?saved.tags.map(t=>`<span class="token">${val(t)}</span>`).join(''):'<span class="muted">未选择</span>'}</span></div><div class="info"><span class="label">交易时间</span><span class="value">${val(saved.time)}</span></div></div>${saved.note?`<div class="sectionbar">备注</div><div class="card"><div class="plainnote" style="color:var(--ink)">${val(saved.note)}</div></div>`:''}`}
function edit(){return `<div class="editcard" style="padding:18px 17px"><div class="type-line" style="margin-bottom:10px"><span class="type-chip">支出</span></div><div class="edit-title">金额 · CNY</div><input aria-label="金额" id="amount" class="biginput" inputmode="decimal" value="${val(draft.amount)}" oninput="draft.amount=this.value"></div><div class="editcard"><div class="field"><div class="ficon">▣</div><div class="fb"><div class="flabel">资金账户</div><div class="fval">信用 <span style="font-size:12px;color:var(--green);font-weight:700">¥−119,027.57</span></div></div></div><div class="field"><div class="ficon">✎</div><div class="fb"><div class="flabel">交易名称</div><input class="entryinput" aria-label="交易名称" value="${val(draft.name)}" oninput="draft.name=this.value"></div></div></div><div class="editcard"><button class="field tap" onclick="openSheet('category')"><div class="ficon">▤</div><div class="fb"><div class="flabel">分类</div><div class="fval">${val(draft.cat)}</div></div><span class="chev">›</span></button><button class="field tap" onclick="openSheet('tags')"><div class="ficon">⌗</div><div class="fb"><div class="flabel">标签 · 多选</div><div class="pills">${draft.tags.length?draft.tags.map(t=>`<span class="pill">${val(t)}</span>`).join(''):'<span class="muted">选择标签</span>'}<span class="pill add">＋ 选择</span></div></div><span class="chev">›</span></button></div><div class="editcard"><button class="field tap" onclick="openSheet('time')"><div class="ficon">◷</div><div class="fb"><div class="flabel">交易时间</div><div class="fval">${val(draft.time)}</div></div><span class="chev">›</span></button><div class="field" style="align-items:start"><div class="ficon">▤</div><div class="fb"><div class="flabel">备注</div><textarea class="noteinput" placeholder="选填" aria-label="备注" oninput="draft.note=this.value">${val(draft.note)}</textarea></div></div></div><div style="text-align:center;margin:12px auto"><button style="background:none;border:0;color:var(--red);padding:10px;font-size:13px" onclick="openSheet('delete')">删除这笔交易</button></div>`}
function list(){return `<div class="headcard" style="padding:16px 18px"><div class="smallcaps">银行 · 2026年10月</div><div style="font-size:21px;font-weight:800;margin:9px 0 4px">交易流水</div></div><div class="list-day">2026年10月27日 · 周二</div><div class="card"><button class="tx-row" onclick="go('detail')"><div class="txicon">☕</div><div><div class="txname">${val(saved.name)}</div><div class="txmeta">${val(saved.cat)}　${saved.time.slice(11)}</div></div><div class="txmoney">¥${formatMoney(saved.amount)}</div></button><button class="tx-row" onclick="go('detail')"><div class="txicon">▣</div><div><div class="txname">购物</div><div class="txmeta">购物 / 日用　14:03</div></div><div class="txmoney">¥159.95</div></button></div>`}
function footer(){return page==='detail'?`<button class="btn outline danger" style="flex:.75" onclick="openSheet('delete')">删除</button><button class="btn primary" onclick="go('edit')">编辑交易</button>`:page==='edit'?`<button class="btn" onclick="go('detail')">取消</button><button class="btn primary" onclick="saveEdit()">保存修改</button>`:`<button class="btn primary" onclick="go('detail')">查看交易详情</button>`}
function saveEdit(){if(!draft.name.trim()||!(Number(draft.amount)>0)){toast('请输入有效金额和交易名称');return} saved={...draft,tags:[...draft.tags]};page='detail';render();toast('示例修改已保存')}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',1700)}
function openSheet(s){sheet=s;render()}
function closeSheet(){sheet='';render()}
function chooseCat(c){draft.cat=c;closeSheet()}
function toggleTag(t){const i=draft.tags.indexOf(t);if(i<0)draft.tags.push(t);else draft.tags.splice(i,1);render()}
function sheetUI(){if(!sheet)return '';const cats=['未分类','餐饮 / 午餐','餐饮 / 早餐','餐饮 / 晚餐','购物 / 日用','交通 / 打车'];const tags=['家庭','孩子','日用','工作','入账'];let body='',title='';
if(sheet==='category'){title='选择分类';body=cats.map(c=>`<button class="sheet-option" onclick="chooseCat('${c}')"><span>${c}</span><span class="check">${draft.cat===c?'✓':''}</span></button>`).join('')}
else if(sheet==='tags'){title='选择标签';body=tags.map(t=>`<button class="sheet-option" onclick="toggleTag('${t}')"><span>${t}</span><span class="check">${draft.tags.includes(t)?'✓':''}</span></button>`).join('')+`<button class="sheet-option" style="color:var(--blue);margin-top:8px;border-radius:12px" onclick="toast('新增标签入口：实际产品保持原有能力')">＋ 新建标签</button>`}
else if(sheet==='time'){title='交易时间';body=`<div class="card" style="padding:15px"><label class="smallcaps" for="demotime">业务时间（演示）</label><input id="demotime" type="datetime-local" style="width:100%;border:0;padding:10px 0;background:transparent" value="${draft.time.replace(' ','T')}" onchange="draft.time=this.value.replace('T',' ')"></div><button class="btn primary" style="margin-top:10px;width:100%" onclick="closeSheet()">完成</button>`}
else if(sheet==='delete'){title='删除交易？';body=`<p class="muted" style="font-size:13px;line-height:1.7">此处仅演示确认样式，不会删除真实账本数据。</p><div class="btnrow" style="display:flex;gap:10px"><button class="btn outline" style="flex:1" onclick="closeSheet()">取消</button><button class="btn primary" style="background:var(--red);flex:1" onclick="closeSheet();toast('演示环境，不执行真实删除')">确认删除</button></div>`}
return `<div class="sheet-overlay" onclick="closeSheet()"></div><div class="sheet"><div class="handle"></div><div class="sheet-top"><strong>${title}</strong><button onclick="closeSheet()">${sheet==='tags'?'完成':'关闭'}</button></div>${body}</div>`}
function render(){document.getElementById('navtitle').textContent=page==='list'?'账户流水':page==='detail'?'交易详情':'编辑交易';document.getElementById('viewport').innerHTML=(page==='list'?list():page==='detail'?detail():edit());document.getElementById('actions').innerHTML=page==='list'?'':footer();document.getElementById('actions').style.display=page==='list'?'none':'flex';document.getElementById('overlay').innerHTML=sheetUI();for(const p of ['list','detail','edit'])document.getElementById('ctl-'+p).classList.toggle('active',page===p)}
render();
</script></body></html>

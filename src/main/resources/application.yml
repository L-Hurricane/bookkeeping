spring:
  application:
    name: bookkeeping
  profiles:
    default: local
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
    baseline-on-migrate: false
    clean-disabled: true

bookkeeping:
  identity:
    session-ttl: ${SESSION_TTL:P7D}
    bootstrap:
      enabled: ${BOOTSTRAP_USER_ENABLED:false}
      username: ${BOOTSTRAP_USERNAME:}
      password: ${BOOTSTRAP_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false

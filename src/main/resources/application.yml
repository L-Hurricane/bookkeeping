spring:
  application:
    name: bookkeeping
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
    baseline-on-migrate: false
    clean-disabled: true

bookkeeping:
  identity:
    session-ttl: ${SESSION_TTL:P7D}
    bootstrap:
      enabled: ${BOOTSTRAP_USER_ENABLED:false}
      username: ${BOOTSTRAP_USERNAME:}
      password: ${BOOTSTRAP_PASSWORD:}
  acceptance-data:
    enabled: ${ACCEPTANCE_DATA_ENABLED:false}
    action: ${ACCEPTANCE_DATA_ACTION:}
  analysis:
    dashscope:
      base-url: ${DASHSCOPE_BASE_URL:}
      api-key: ${DASHSCOPE_API_KEY:}
      model: ${DASHSCOPE_MODEL:qwen3.7-flash}
      timeout: ${DASHSCOPE_TIMEOUT:PT60S}
      max-completion-tokens: ${DASHSCOPE_MAX_COMPLETION_TOKENS:2048}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false
